<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PREVIEW FIXTURE — Design Compositor settings</title>
<style>
  html,body{margin:0;background:#CFC9BC}
  .ribbon{position:fixed;top:0;left:0;right:0;z-index:9999;background:#191917;color:#F7F5F0;font:600 11px/1.4 ui-sans-serif,system-ui,sans-serif;padding:6px 10px;text-align:center;letter-spacing:.02em}
  .stage{display:flex;flex-wrap:wrap;gap:18px;padding:38px 16px 24px;justify-content:center}
  .frame{border:1px solid #B8B1A1;border-radius:12px;overflow:hidden;background:#F7F5F0;width:640px;max-width:100%;box-shadow:0 10px 30px -18px rgba(0,0,0,.5)}
  .frame .cap{font:600 10px/1.4 ui-monospace,monospace;color:#56534B;background:#EFEBE2;padding:6px 9px;border-bottom:1px solid #DDD6C8}
  .frame iframe{width:100%;height:820px;border:0;display:block}
</style>
</head>
<body>
<div class="ribbon">PREVIEW FIXTURE — real options.html styles + mocked data · NOT the extension runtime (no chrome.* APIs)</div>
<div class="stage" id="stage"></div>
<script>
const MODELS=["gpt-oss-120b","llama-3.3-70b-versatile","mixtral-8x7b-32768","qwen-2.5-coder-32b","whisper-large-v3"];
function populate(doc){
  const $=(id)=>doc.getElementById(id);
  $("base").value="https://api.groq.com/openai/v1";
  $("key").value="gsk_live_7Q2x9fakefakefakefakefake";
  $("model").value="gpt-oss-120b";
  const msg=$("msg"); msg.textContent="Key works. "+MODELS.length+" models available — click one to select it."; msg.dataset.ok="1";
  const ul=$("models"); ul.innerHTML="";
  for(const id of MODELS){ const li=doc.createElement("li"); const b=doc.createElement("button"); b.type="button"; b.textContent=id; li.appendChild(b); ul.appendChild(li); }
  // render the provider presets exactly as options.js would
  const PRE=[["OpenAI","https://api.openai.com/v1"],["Groq","https://api.groq.com/openai/v1"],["Gemini (compat)","https://generativelanguage.googleapis.com/v1beta/openai"],["OpenRouter","https://openrouter.ai/api/v1"],["Together","https://api.together.xyz/v1"],["Local :11434","http://localhost:11434/v1"]];
  const p=$("presets"); for(const [l,u] of PRE){ const b=doc.createElement("button"); b.type="button"; b.textContent=l; b.title=u; p.appendChild(b); }
}
async function mount(){
  const html=await (await fetch("/options.html", { cache: "no-store" })).text();
  const doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("script").forEach(s=>s.remove());
  const srcdoc="<!doctype html>"+doc.documentElement.outerHTML;
  const frame=document.createElement("div"); frame.className="frame";
  const cap=document.createElement("div"); cap.className="cap"; cap.textContent="options.html · populated model list";
  const ifr=document.createElement("iframe"); ifr.setAttribute("srcdoc",srcdoc);
  ifr.addEventListener("load",()=>{ try{ populate(ifr.contentDocument); }catch(e){ cap.textContent+=" — "+e.message; } });
  frame.appendChild(cap); frame.appendChild(ifr); document.getElementById("stage").appendChild(frame);
}
mount();
</script>
</body>
</html>
