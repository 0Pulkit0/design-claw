<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PREVIEW FIXTURE — Design Compositor side panel</title>
<style>
  /* Fixture-only chrome. The panel's own styles are fetched from the real
     sidepanel.html at runtime so this preview can never drift from production.
     This is NOT the extension: there are no chrome.* APIs here and no real
     captures — the reference images are generated SVGs and the data is mocked. */
  html,body{margin:0;background:#CFC9BC}
  .ribbon{position:fixed;top:0;left:0;right:0;z-index:9999;background:#191917;color:#F7F5F0;font:600 11px/1.4 ui-sans-serif,system-ui,sans-serif;padding:6px 10px;text-align:center;letter-spacing:.02em}
  .stage{display:flex;flex-wrap:wrap;gap:20px;padding:38px 16px 24px;align-items:flex-start;justify-content:center}
  .frame{border:1px solid #B8B1A1;border-radius:12px;overflow:hidden;background:#F7F5F0;box-shadow:0 10px 30px -18px rgba(0,0,0,.5)}
  .frame .cap{font:600 10px/1.4 ui-monospace,monospace;color:#56534B;background:#EFEBE2;padding:6px 9px;border-bottom:1px solid #DDD6C8}
  .frame .app{height:820px;width:100%;border:0;display:block}
</style>
</head>
<body>
<div class="ribbon">PREVIEW FIXTURE — real sidepanel.html styles + mocked data · NOT the extension runtime (no chrome.* APIs, no real captures)</div>
<div class="stage" id="stage"></div>
<script>
const WIDTHS = (new URLSearchParams(location.search).get("w") || "320,400,480").split(",").map(Number);
const STATE = new URLSearchParams(location.search).get("state") || "full";
const ICON = {
  up:'<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5V3.5M4 7l4-4 4 4"/></svg>',
  down:'<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5v9M12 9l-4 4-4-4"/></svg>',
  x:'<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
};
// a plausible "captured component" image at the card's 16:10 ratio
function shot(bg,fg,accent){
  const s=`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='200'><rect width='320' height='200' fill='${bg}'/>`
   +`<rect x='22' y='26' width='120' height='13' rx='4' fill='${fg}' opacity='.9'/>`
   +`<rect x='22' y='52' width='230' height='22' rx='5' fill='${fg}' opacity='.75'/>`
   +`<rect x='22' y='84' width='200' height='7' rx='3' fill='${fg}' opacity='.45'/>`
   +`<rect x='22' y='98' width='170' height='7' rx='3' fill='${fg}' opacity='.45'/>`
   +`<rect x='22' y='126' width='92' height='30' rx='8' fill='${accent}'/>`
   +`<rect x='126' y='126' width='92' height='30' rx='8' fill='none' stroke='${fg}' stroke-opacity='.4'/></svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(s);
}
// a tall "stitched area capture" (many viewports high) to prove the thumb stays a
// consistent crop while the inspector shows the whole image.
function shotTall(bg,fg,accent){
  var rows=""; for(var y=40;y<1360;y+=120){ rows+=`<rect x='22' y='${y}' width='${180+((y*7)%90)}' height='10' rx='4' fill='${fg}' opacity='.5'/>`; }
  var s=`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='1400'><rect width='320' height='1400' fill='${bg}'/><rect x='22' y='24' width='150' height='16' rx='4' fill='${accent}'/>`+rows+`</svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(s);
}
const ROLE_ORDER=["spine","type","palette","shape","component"];
const ROLE_LABEL={spine:"Base reference",type:"Typography source",palette:"Color source",shape:"Shape source",component:"Pattern only"};
const REFS=[
  {host:"stripe.com",role:"spine",measured:true,note:"base layout + spacing",c:["#0A2540","#FFFFFF","#635BFF"]},
  {host:"very-long-subdomain.marketing.example-company.co.uk",role:"type",measured:true,note:"",c:["#FFFFFF","#111111","#111111"]},
  {host:"linear.app",role:"palette",measured:true,tags:["visible part only"],note:"accent + muted surfaces — keep the grays, this note is deliberately long to check that it clamps to two lines instead of pushing the controls around",c:["#141516","#E6E6E6","#5E6AD2"]},
  {host:"dribbble.com",role:"component",measured:false,tall:true,note:"pricing table — area capture, stitched",c:["#FDF6F7","#1E1E1E","#EA4C89"]},
];
const SAMPLE=`---\ngenerator: Design Compositor\npolicy_version: 1.1.0\n---\n\n# Compiled design system\n\n## Precedence\n\nREF-01 (stripe.com) is the base reference: it supplies the base measurements and\ngoverns structural layout and spacing. REF-02 (…example-company.co.uk) overrides\ntypography only. REF-03 (linear.app) overrides the palette only.\n\n## Tokens (measured — DOM/CSS, never vision)\n\n\`\`\`yaml\ntypography:\n  font_family: "Inter, system-ui, sans-serif"\n  size: "18px"\n  line_height: "1.55"\ncolor:\n  text: "#0A2540"\n  background: "rgb(255, 255, 255)"\nshape:\n  radius: "10px"\n  shadow: "none"\n\`\`\`\n\nCoverage: 21 of 31 expected properties measured.`;
const esc=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function liMarkup(ref,i,all){
  const roleSel = ROLE_ORDER.map(r=>`<option${r===ref.role?" selected":""}>${ROLE_LABEL[r]}</option>`).join("");
  const facts = [ref.measured?"Styles measured":"Image only"].concat(ref.tags||[]).join(" · ");
  const arrows = all.length>1
    ? `<button class="icon-btn"${i===0?" disabled":""} aria-label="Move up">${ICON.up}</button><button class="icon-btn"${i===all.length-1?" disabled":""} aria-label="Move down">${ICON.down}</button>`
    : "";
  const issue = ref.measured ? "" :
    `<div class="item-issues"><div class="issue info"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.3"/><path d="M8 5.3v3.4M8 10.9h.01" stroke-linecap="round"/></svg><span>Image only — no measured CSS. <button class="act">Capture an element</button></span></div></div>`;
  const base = ref.role==="spine" ? `<span class="base-tag">BASE</span>` : "";
  return `<li class="item${ref.role==="spine"?" spine":""}">`
    + `<div class="pre-num" aria-hidden="true">${i+1}</div>`
    + `<button class="thumb-btn" aria-label="Inspect ${esc(ref.host)}"><img class="thumb" alt="" src="${(ref.tall?shotTall:shot)(ref.c[0],ref.c[1],ref.c[2])}"></button>`
    + `<div class="card-body">`
    + `<button class="name" title="https://${esc(ref.host)}/path"><span style="overflow:hidden;text-overflow:ellipsis">${esc(ref.host)}</span>${base}</button>`
    + `<div class="role-row"><select aria-label="Role for ${esc(ref.host)}">${roleSel}</select></div>`
    + `<div class="facts"><div>${facts}</div>${ref.note?`<div class="note-text">${esc(ref.note)}</div>`:""}</div>`
    + issue
    + `<div class="card-tools">${arrows}<div class="spacer"></div><button class="icon-btn danger" aria-label="Remove">${ICON.x}</button></div>`
    + `</div></li>`;
}
function tokensMarkup(){
  const row=(k,v,badge,src)=>`<div class="tok-row"><span class="tok-k">${k}</span><span class="tok-v${v==null?' none':''}">${v==null?'unavailable':esc(v)}</span><span class="tok-right">${badge?`<span class="tok-badge ${badge}">${badge}</span>`:''}${src?`<button class="tok-src">${src}</button>`:''}</span></div>`;
  const grp=(t,rows)=>`<div class="tok-group"><h4>${t}</h4>${rows.join('')}</div>`;
  const ic='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.3"/><path d="M8 5.3v3.4M8 10.9h.01" stroke-linecap="round"/></svg>';
  return grp('Typography',[row('Font family','Inter, system-ui, sans-serif',null,'REF-02'),row('Size','18px',null,'REF-01'),row('Line height','1.55','fallback','REF-01'),row('Font candidate','Inter','candidate','REF-02')])
    + grp('Color',[row('Text','#0A2540',null,'REF-03'),row('Background','rgb(255, 255, 255)',null,'REF-03')])
    + grp('Shape',[row('Radius','10px',null,'REF-01'),row('Shadow','none',null,'REF-01')])
    + `<details class="diag" open><summary><svg class="caret" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/></svg> Diagnostics (2)</summary><div class="inner"><div class="item-issues"><div class="issue warn">${ic}<span>Shape · box-shadow wasn't measured by any source — left unavailable, not invented. <button class="act">open REF-01</button></span></div><div class="issue warn">${ic}<span>Font "Inter" is a candidate from document.fonts.check — not a verified rendered face.</span></div></div></div></details>`;
}
function inspectorMarkup(){
  // `absent` = a recorded "none" (a measured absence); `none` = never measured.
  const mrow=(k,v,unc,absent)=>`<div class="msr-row"><span class="mk">${k}</span><span class="mv${v==null?' none':absent?' absent':''}">${v==null?'not measured':esc(v)}${unc?' <span class="unc">unverified</span>':''}</span></div>`;
  const grp=(t,rows)=>`<div class="msr-group"><h4>${t}</h4>${rows.join('')}</div>`;
  const fld=(k,v)=>`<div class="insp-field"><span class="insp-k">${k}</span><div class="insp-url">${esc(v)}</div></div>`;
  return `<img class="insp-crop" alt="" src="${shotTall('#0A2540','#FFFFFF','#635BFF')}">`
    + fld('Source','https://stripe.com/payments/checkout?ref=nav#pricing')
    + `<div class="insp-field"><span class="insp-k">Role</span><select><option>Base reference</option></select></div>`
    + `<div class="insp-field"><span class="insp-k">Note</span><input class="note" value="base layout + spacing"></div>`
    + fld('Contributes','Styles measured')
    + fld('Captured','360×220px  ·  48 KB  ·  visible part only')
    + grp('Typography',[mrow('Font family','Inter, system-ui, sans-serif'),mrow('Size','18px'),mrow('Transform','none',false,true),mrow('Candidate','Inter',true)])
    + grp('Colors',[mrow('Text','#0A2540'),mrow('Background','rgb(255, 255, 255)'),mrow('Border color',null)])
    + grp('Shape',[mrow('Radius','10px'),mrow('Shadow','none',false,true)])
    + grp('Spacing & layout',[mrow('Padding top','16px'),mrow('Gap','12px'),mrow('Display','flex')]);
}
function populate(doc, state){
  const $=(id)=>doc.getElementById(id);
  const show=(id,on)=>{const e=$(id); if(e) e.hidden=!on;};
  const tray=$("tray"), empty=$("empty"), head=$("tray-head"), count=$("tray-count");
  $("chip-label").textContent = "gpt-oss-120b"; $("chip").dataset.ok="1";
  if(state==="empty"){ empty.hidden=false; if(head) head.hidden=true; return; }
  if(state==="envwarn"){ show("env-warn",true); $("env-warn-msg").textContent="This browser can't coordinate reference changes safely (the Web Locks API is unavailable). Changes are blocked to avoid overwriting another window."; $("pick").disabled=true; $("pick-region").disabled=true; }
  const refs = state==="single" ? REFS.slice(0,1) : state==="spinewarn" ? REFS.slice(1,3) : REFS;
  tray.innerHTML = refs.map((r,i)=>liMarkup(r,i,refs)).join("");
  empty.hidden=true; if(head) head.hidden=false; if(count) count.textContent = refs.length+(refs.length===1?" reference":" references");
  $("brief").value = "a pricing page for Atlas, my budgeting app";
  $("compile").disabled = false;
  if(state==="spinewarn"){ show("spine-warn",true); $("compile").disabled=true; }
  if(state==="saving"){ $("compile").disabled=true; $("compile").textContent="Saving edit…"; }
  if(state==="output"||state==="stale"||state==="tokens"){ show("out",true); $("output").textContent=SAMPLE; if(state==="stale") show("stale",true); }
  if(state==="tokens"){
    $("tab-tokens").setAttribute("aria-selected","true"); $("tab-design").setAttribute("aria-selected","false");
    $("output").hidden=true; $("tokens-view").hidden=false; $("tokens-view").innerHTML=tokensMarkup();
    $("md-actions").hidden=true; $("json-actions").hidden=false;
  }
  if(state==="inspector"){
    show("out",true); $("output").textContent=SAMPLE;
    $("insp-title").textContent="stripe.com"; $("insp-body").innerHTML=inspectorMarkup();
    try{ $("inspector").showModal(); }catch(e){ $("inspector").setAttribute("open",""); }
  }
}
async function mount(){
  const html = await (await fetch("/sidepanel.html", { cache: "no-store" })).text();
  const doc = new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("script").forEach(s=>s.remove());
  const srcdoc = "<!doctype html>"+doc.documentElement.outerHTML;
  const stage = document.getElementById("stage");
  const states = STATE==="all" ? ["empty","full","output","tokens"] : STATE.split(",");
  for(const w of WIDTHS){
    for(const st of states){
      const frame=document.createElement("div"); frame.className="frame"; frame.style.width=w+"px";
      const cap=document.createElement("div"); cap.className="cap"; cap.textContent=w+"px · "+st;
      const ifr=document.createElement("iframe"); ifr.className="app"; ifr.setAttribute("srcdoc", srcdoc);
      ifr.addEventListener("load", ()=>{ try{ populate(ifr.contentDocument, st); }catch(e){ cap.textContent+=" — "+e.message; } });
      frame.appendChild(cap); frame.appendChild(ifr); stage.appendChild(frame);
    }
  }
}
mount();
</script>
</body>
</html>
